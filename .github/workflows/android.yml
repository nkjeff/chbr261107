name: Android ARM64 Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and ABI contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -t "$APK"
          if unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "arm64-v8a" { bad=1 } END { exit bad ? 0 : 1 }'; then
            echo "Unexpected non-ARM64 native library found"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/chbr261107-arm64-v8a-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chbr261107-arm64-v8a-debug
          path: dist/chbr261107-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
